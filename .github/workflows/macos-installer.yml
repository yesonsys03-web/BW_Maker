# macOS 설치본(.app/.dmg)을 Apple Silicon과 Intel에서 각각 네이티브로 만들어
# 릴리스 자산으로 올린다. PyInstaller 사이드카는 크로스 컴파일할 수 없으므로
# 두 아키텍처를 각 아키텍처의 러너에서 동결해야 한다.
#
# 서명하지 않는다. 인증서가 아직 없고, 서명 없이 배포할 때의 Gatekeeper 안내는
# README에 적는다. notarize를 하려면 동봉한 사이드카의 중첩 Mach-O(_internal의
# .so/.dylib까지)를 개별 서명해야 한다 — --deep은 폐기됐다.
name: macOS installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # 릴리스 자산 업로드

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-${{ matrix.architecture }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      # 동결이 실패하면 여기서 빌드가 끝난다. 스크립트 안의 임포트 게이트와
      # 스모크(engine/packaging/smoke.py)가 그 판단을 대신한다.
      - name: Freeze the engine sidecar
        run: bash scripts/build-engine.sh

      - name: Build installers
        run: pnpm tauri build --bundles app dmg

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          # 수동 실행은 초안으로. 태그 push만 공개 릴리스가 된다.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
