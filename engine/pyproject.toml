[project]
name = "psd-engine"
version = "0.1.0"
description = "PSD layer extraction/edit/export JSON-RPC engine"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "psd-tools>=1.17,<2",
    "pytoshop==1.2.1",
    "six>=1.16",
    "numpy>=2",
    "pillow>=12",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psd_engine"]
